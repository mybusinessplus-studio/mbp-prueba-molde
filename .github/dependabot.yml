version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
    # Versiones mayores de herramientas base: se adoptan a propósito (ADR), no por PR automático.
    # Las alertas de seguridad de Dependabot siguen apareciendo (y el panel las muestra).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
